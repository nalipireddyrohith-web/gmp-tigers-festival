<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Committee Management</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:30px;
}

h1{
    text-align:center;
    color:#ff6600;
}

form{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    background:#ff6600;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#ff6600;
    color:white;
}

a{
    color:red;
    text-decoration:none;
    font-weight:bold;
}
</style>

</head>
<body>

<h1>👥 Committee Management</h1>

<form action="/save_committee" method="POST" enctype="multipart/form-data">

<input
type="text"
name="name"
placeholder="Member Name"
required>

<input
type="text"
name="designation"
placeholder="Designation"
required>

<input
type="text"
name="mobile"
placeholder="Mobile Number"
required>


<input
type="file"
name="photo"
accept="image/*"
required>

<button type="submit">Add Member</button>


</form>

<table>

<tr>
<th>ID</th>
<th>Photo</th>
<th>Name</th>
<th>Designation</th>
<th>Mobile</th>
<th>Edit</th>
<th>Change Photo</th>
<th>Delete</th>
</tr>

{% for m in members %}

<tr>
<td>{{ m[0] }}</td>

<td>
{% if m[4] %}
<img src="{{ url_for('static', filename='committee_photos/' + m[4]) }}" width="80" height="80" style="border-radius:50%;">
{% else %}
No Photo
{% endif %}
</td>

<td>{{ m[1] }}</td>

<td>{{ m[2] }}</td>
<td>{{ m[3] }}</td>

<td>
<a href="/edit_committee/{{ m[0] }}" style="color:green;text-decoration:none;font-weight:bold;">
Edit
</a>
</td>

<td>
<a href="/change_committee_photo/{{ m[0] }}" style="color:blue;text-decoration:none;font-weight:bold;">
📷 Change Photo
</a>
</td>

<td>
<a href="/delete_committee/{{ m[0] }}" style="color:red;text-decoration:none;font-weight:bold;">
🗑️ Delete
</a>
</td>

</tr>

{% endfor %}

</table>

</body>
</html>
