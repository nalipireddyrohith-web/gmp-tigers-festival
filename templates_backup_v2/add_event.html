<!DOCTYPE html>
<html>
<head>
<title>Add Event</title>
<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    padding:40px;
}
.container{
    width:450px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
}
input{
    width:100%;
    padding:10px;
    margin:10px 0;
}
button{
    background:#ff6b00;
    color:white;
    border:none;
    padding:12px;
    width:100%;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="container">

<h2>Add Festival Event</h2>

<form action="/save_event" method="POST">

<input type="text" name="event" placeholder="Event Name" required>

<input type="date" name="date" required>

<input type="time" name="time" required>

<button type="submit">Save Event</button>

</form>

</div>

</body>
</html>
