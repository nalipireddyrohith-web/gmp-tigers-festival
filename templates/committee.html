{% extends "base.html" %}

{% block title %}Committee | GMP TIGERS{% endblock %}

{% block content %}

<h1 style="text-align:center;margin:30px 0;">👥 Festival Committee</h1>

<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:30px;">

{% for m in members %}

<div style="width:250px;background:#fff;border-radius:12px;padding:20px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.15);">

<h3>{{ m["name"] }}</h3>

<p><strong>{{ m["designation"] }}</strong></p>

<p>{{ m["mobile"] }}</p>

</div>

{% endfor %}

</div>

{% endblock %}
