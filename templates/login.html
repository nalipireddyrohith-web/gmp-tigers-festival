<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>

.login-box{
width:400px;
margin:100px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.2);
text-align:center;
}

.login-box h1{
color:#ff6b00;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin:12px 0;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#ff6b00;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#d35400;
}

</style>

</head>

<body>

<div class="login-box">

<h1>🔐 Admin Login</h1>

<form action="/login" method="POST">

<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

</div>

</body>
</html>
