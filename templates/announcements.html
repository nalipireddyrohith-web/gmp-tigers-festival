{% extends 'base.html' %}

{% block title %}Announcements{% endblock %}

{% block content %}

<h1 style="text-align:center;">📢 Announcements</h1>

{% for a in announcements %}
<div style="max-width:800px;margin:20px auto;padding:20px;background:white;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);">
    <h2>{{ a['title'] }}</h2>
    <p>{{ a['message'] }}</p>
    <small>{{ a['date'] }}</small>
</div>
{% else %}
<h3 style="text-align:center;">No announcements available.</h3>
{% endfor %}

{% endblock %}
