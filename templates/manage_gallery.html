<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Manage Gallery</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:30px;}
h1{color:#ff6b00;}
.upload{background:#fff;padding:20px;border-radius:10px;margin-bottom:25px;}
button{background:#ff6b00;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;}
.card{background:#fff;border-radius:10px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.card img,.card video{width:100%;height:180px;object-fit:cover;border-radius:8px;}
.delete{display:block;text-align:center;background:#dc3545;color:#fff;text-decoration:none;padding:8px;margin-top:10px;border-radius:5px;}
</style>
</head>
<body>

<h1>Manage Gallery</h1>

<div class="upload">
<form action="{{ url_for('upload_image') }}" method="POST" enctype="multipart/form-data">
<input type="file" name="file" multiple required>
<br><br>
<button type="submit">Upload Images / Videos</button>
</form>
</div>

<div class="grid">
{% for file in files %}
<div class="card">

{% if file.lower().endswith(('.jpg','.jpeg','.png','.gif','.webp')) %}
<img src="{{ url_for('static', filename='uploads/' + file) }}">
{% else %}
<video controls>
<source src="{{ url_for('static', filename='uploads/' + file) }}">
</video>
{% endif %}

<a class="delete"
href="{{ url_for('delete_media', filename=file) }}"
onclick="return confirm('Delete this file?')">
🗑 Delete
</a>

</div>
{% endfor %}
</div>

</body>
</html>
