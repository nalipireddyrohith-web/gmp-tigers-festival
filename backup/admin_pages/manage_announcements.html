<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Announcements</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:30px;
}

h1{
    text-align:center;
    color:#ff6600;
}

form{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:30px;
}

input,textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    background:#ff6600;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#ff6600;
    color:white;
}

a{
    color:red;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>
<body>

<h1>📢 Manage Announcements</h1>

<form action="/add_announcement" method="POST">

<input
type="text"
name="title"
placeholder="Announcement Title"
required>

<textarea
name="message"
rows="4"
placeholder="Announcement Message"
required></textarea>

<button type="submit">
Add Announcement
</button>

</form>

<table>

<tr>
<th>ID</th>
<th>Title</th>
<th>Message</th>
<th>Date</th>
<th>Delete</th>
</tr>

{% for a in announcements %}

<tr>

<td>{{ a[0] }}</td>
<td>{{ a[1] }}</td>
<td>{{ a[2] }}</td>
<td>{{ a[3] }}</td>

<td>
<a href="/delete_announcement/{{ a[0] }}">
Delete
</a>
</td>

</tr>

{% endfor %}

</table>

</body>
</html>
