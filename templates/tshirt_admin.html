<!DOCTYPE html>
<html>
<head>
    <title>T-Shirt Registrations</title>
    <style>
        body{
            font-family:Arial;
            background:#f5f5f5;
            padding:30px;
        }
        h1{
            text-align:center;
            color:#ff6600;
        }
        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }
        th,td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }
        th{
            background:#ff6600;
            color:white;
        }
        a{
            color:red;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>
<body>

<h1>T-Shirt Registrations</h1>

<table>
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Mobile</th>
    <th>Size</th>
    <th>Quantity</th>
    <th>Address</th>
    <th>Delete</th>
</tr>

{% for row in registrations %}
<tr>
    <td>{{ row['id'] }}</td>
    <td>{{ row['name'] }}</td>
    <td>{{ row['mobile'] }}</td>
    <td>{{ row['tshirt_size'] }}</td>
    <td>{{ row['quantity'] }}</td>
    <td>{{ row['address'] }}</td>
    <td><a href="/delete_tshirt/{{ row['id'] }}">Delete</a></td>
</tr>
{% endfor %}

</table>

</body>
</html>
