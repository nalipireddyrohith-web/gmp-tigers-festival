<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Edit Committee Member</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:30px;
}
form{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}
input{
    width:100%;
    padding:10px;
    margin:10px 0;
}
button{
    background:#ff6600;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
}
</style>

</head>
<body>

<h2 align="center">✏️ Edit Committee Member</h2>

<form action="{{ url_for('edit_committee', id=member[0]) }}" method="POST">

<input type="text" name="name" value="{{ member[1] }}" required>

<input type="text" name="designation" value="{{ member[2] }}" required>

<input type="text" name="mobile" value="{{ member[3] }}" required>

<button type="submit">Update Member</button>

</form>

</body>
</html>
