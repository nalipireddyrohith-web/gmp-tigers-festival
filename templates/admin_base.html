<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}GMP Admin{% endblock %}</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

.header{
position:fixed;
top:0;
left:0;
right:0;
height:70px;
background:#ff6b00;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
color:#fff;
z-index:1000;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

.header h2{
font-size:28px;
}

.icon-btn{
background:white;
color:#ff6b00;
border:none;
padding:12px 18px;
border-radius:30px;
cursor:pointer;
font-size:18px;
font-weight:bold;
text-decoration:none;
}

.sidebar{
position:fixed;
top:0;
left:-280px;
width:280px;
height:100%;
background:#ff6b00;
overflow:auto;
transition:.3s;
z-index:2000;
padding-top:20px;
}

.sidebar.active{
left:0;
}

.sidebar h2{
color:white;
text-align:center;
margin-bottom:20px;
}

.sidebar a{
display:block;
padding:16px 22px;
color:white;
text-decoration:none;
font-size:18px;
}

.sidebar a:hover{
background:white;
color:#ff6b00;
}

.close{
text-align:right;
padding-right:20px;
font-size:30px;
cursor:pointer;
color:white;
}

.overlay{
display:none;
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,.5);
z-index:1500;
}

.overlay.active{
display:block;
}

.content{
margin-top:90px;
padding:25px;
}

</style>

</head>

<body>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="sidebar" id="sidebar">

<div class="close" onclick="closeMenu()">&times;</div>

<h2>🎉 GMP TIGERS</h2>

<a href="/dashboard"><i class="fa-solid fa-house"></i> Dashboard</a>

<a href="/manage_events"><i class="fa-solid fa-calendar-days"></i> Events</a>

<a href="/manage_committee"><i class="fa-solid fa-users"></i> Committee</a>

<a href="/manage_announcements"><i class="fa-solid fa-bullhorn"></i> Announcements</a>

<a href="/donation_admin"><i class="fa-solid fa-hand-holding-dollar"></i> Donations</a>

<a href="/tshirt_admin"><i class="fa-solid fa-shirt"></i> T-Shirts</a>

<a href="/manage_gallery"><i class="fa-solid fa-images"></i> Gallery</a>

<a href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>

</div>

<div class="header">

<a href="/dashboard" class="icon-btn">
<i class="fa-solid fa-arrow-left"></i>
</a>

<h2>🕉 GMP TIGERS</h2>

<button class="icon-btn" onclick="openMenu()">
☰ Menu
</button>

</div>

<div class="content">

{% block content %}
{% endblock %}

</div>

<script>

function openMenu(){
document.getElementById("sidebar").classList.add("active");
document.getElementById("overlay").classList.add("active");
}

function closeMenu(){
document.getElementById("sidebar").classList.remove("active");
document.getElementById("overlay").classList.remove("active");
}

</script>

</body>
</html>
