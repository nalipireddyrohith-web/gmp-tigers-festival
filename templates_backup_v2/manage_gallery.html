<!DOCTYPE html>
<html>
<head>
<title>Manage Gallery</title>
<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    padding:40px;
}
h1{
    color:#ff6b00;
}
form{
    background:white;
    padding:20px;
    border-radius:10px;
    width:400px;
}
input[type=file]{
    margin:15px 0;
}
button{
    background:#ff6b00;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>
<body>

<h1>Manage Gallery</h1>

<form action="/upload" method="POST" enctype="multipart/form-data">
    <input type="file" name="photo">
    <br>
    <button type="submit">Upload Photo</button>
</form>

</body>
</html>
