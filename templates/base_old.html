<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}GMP TIGERS{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

body{
background:#f5f5f5;
}

.navbar{
background:#ff6b00;
box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.navbar-brand{
font-size:30px;
font-weight:bold;
color:#fff!important;
}

.menu-btn{
background:#fff;
color:#ff6b00;
font-weight:bold;
border-radius:30px;
padding:8px 18px;
border:none;
}

.offcanvas{
width:280px;
background:#ff6b00;
color:white;
}

.offcanvas-header{
border-bottom:1px solid rgba(255,255,255,.2);
}

.offcanvas-title{
font-size:24px;
font-weight:bold;
}

.offcanvas .nav-link{
color:white;
font-size:18px;
padding:14px 10px;
border-radius:10px;
margin-bottom:8px;
transition:.3s;
}

.offcanvas .nav-link:hover{
background:rgba(255,255,255,.18);
padding-left:20px;
}

footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:50px;
}

</style>

</head>

<body>

<nav class="navbar sticky-top">

<div class="container-fluid d-flex align-items-center justify-content-between">

<button
class="btn btn-light"
onclick="if(document.referrer){history.back();}else{window.location='/';}">
<i class="fa-solid fa-arrow-left"></i>
</button>

<a class="navbar-brand mx-auto" href="/">
🕉 GMP TIGERS
</a>

<button
class="menu-btn"
type="button"
data-bs-toggle="offcanvas"
data-bs-target="#menu">

☰ Menu

</button>

</div>

</nav>

<div class="offcanvas offcanvas-start" tabindex="-1" id="menu">

<div class="offcanvas-header">

<h5 class="offcanvas-title">
🕉 GMP TIGERS
</h5>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="offcanvas">
</button>

</div>

<div class="offcanvas-body">

<ul class="navbar-nav">

<li>
<a class="nav-link"
href="#"
onclick="if(document.referrer){history.back();}else{window.location='/';}">
<i class="fa-solid fa-arrow-left"></i> Back
</a>
</li>

<hr style="border-color:rgba(255,255,255,.3);">


<li><a class="nav-link" href="/"><i class="fa-solid fa-house"></i> Home</a></li>

<li><a class="nav-link" href="/events"><i class="fa-solid fa-calendar-days"></i> Events</a></li>

<li><a class="nav-link" href="/committee"><i class="fa-solid fa-users"></i> Committee</a></li>

<li><a class="nav-link" href="/gallery"><i class="fa-solid fa-image"></i> Gallery</a></li>

<li><a class="nav-link" href="/donation"><i class="fa-solid fa-hand-holding-heart"></i> Donation</a></li>

<li><a class="nav-link" href="/tshirt"><i class="fa-solid fa-shirt"></i> T-Shirts</a></li>

<li><a class="nav-link" href="/about"><i class="fa-solid fa-circle-info"></i> About</a></li>

<li><a class="nav-link" href="/contact"><i class="fa-solid fa-phone"></i> Contact</a></li>

<hr style="border-color:rgba(255,255,255,.3);">

<li>
<a class="nav-link" href="/admin">
<i class="fa-solid fa-lock"></i> Admin Login
</a>
</li>

</ul>

</div>

</div>

<main>

{% block content %}
{% endblock %}

</main>

<footer>

© 2026 GMP TIGERS • Godugumani Palle • Vinayaka Chavithi

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
