<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-Shirt Registration | GMP TIGERS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f5f5;
}

nav{
background:#ff6600;
padding:18px 50px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:white;
font-size:30px;
font-weight:bold;
}

nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin-left:25px;
}

nav ul li a{
color:white;
text-decoration:none;
font-weight:bold;
}

.hero{
height:35vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
url("{{ url_for('static', filename='images/ganesha.jpg') }}");
background-size:cover;
background-position:center;
}

.hero h1{
color:white;
font-size:55px;
}

.container{
width:90%;
max-width:700px;
margin:40px auto;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

label{
font-weight:bold;
display:block;
margin-top:15px;
margin-bottom:8px;
}

input,select,textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
margin-top:25px;
width:100%;
padding:15px;
background:#ff6600;
color:white;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#e65c00;
}

footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>

</head>

<body>

<nav>

<div class="logo">🕉 GMP TIGERS</div>

<ul>
<li><a href="/">Home</a></li>
<li><a href="/about">About</a></li>
<li><a href="/aim">Aim</a></li>
<li><a href="/events">Events</a></li>
<li><a href="/gallery">Gallery</a></li>
<li><a href="/tshirt">T-Shirts</a></li>
<li><a href="/contact">Contact</a></li>
</ul>

</nav>

<div class="hero">
<h1>T-Shirt Registration</h1>
</div>

<div class="container">

<form method="POST">

<label>Full Name</label>
<input type="text" name="name" required>

<label>Mobile Number</label>
<input type="text" name="mobile" required>

<label>T-Shirt Size</label>
<select name="size" required>
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>

<label>Quantity</label>
<input type="number" name="quantity" min="1" required>

<label>Address</label>
<textarea name="address" rows="4" required></textarea>

<button type="submit">Register</button>

</form>

</div>

<footer>

© 2026 GMP TIGERS | Godugumani Palle

</footer>

</body>
</html>
