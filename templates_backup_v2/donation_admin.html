<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donation Admin</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:30px;
}

h1{
    text-align:center;
    color:#ff6600;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:20px;
}

th{
    background:#ff6600;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
}

a{
    color:red;
    text-decoration:none;
    font-weight:bold;
}

.total{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    font-size:22px;
    text-align:center;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>💰 Donation Management</h1>

<div class="total">
Total Donations: ₹ {{ total }}
</div>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Mobile</th>
<th>Amount</th>
<th>Mode</th>
<th>Transaction ID</th>
<th>Date</th>
<th>Delete</th>
</tr>

{% for d in donations %}

<tr>

<td>{{ d[0] }}</td>
<td>{{ d[1] }}</td>
<td>{{ d[2] }}</td>
<td>₹ {{ d[3] }}</td>
<td>{{ d[4] }}</td>
<td>{{ d[5] }}</td>
<td>{{ d[6] }}</td>

<td>
<a href="/delete_donation/{{ d[0] }}">Delete</a>
</td>

</tr>

{% endfor %}

</table>

</body>
</html>
