<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gallery</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:30px;}
h1{text-align:center;color:#ff6b00;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.card img,.card video{width:100%;height:220px;object-fit:cover;}
</style>
</head>
<body>

<h1>Gallery</h1>

<div class="grid">
{% for file in files %}
<div class="card">

{% if file.lower().endswith(('.jpg','.jpeg','.png','.gif','.webp')) %}
<img src="{{ url_for('static', filename='uploads/' + file) }}">
{% else %}
<video controls>
<source src="{{ url_for('static', filename='uploads/' + file) }}">
</video>
{% endif %}

</div>
{% endfor %}
</div>

</body>
</html>
