<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donate | GMP TIGERS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f5f5;
}

nav{
background:#ff6600;
padding:18px 50px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:white;
font-size:28px;
font-weight:bold;
}

nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin-left:20px;
}

nav ul li a{
color:white;
text-decoration:none;
font-weight:bold;
}

.container{
width:90%;
max-width:900px;
margin:40px auto;
display:flex;
gap:40px;
flex-wrap:wrap;
}

.left,.right{
flex:1;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.left{
text-align:center;
}

.left img{
width:280px;
border-radius:10px;
}

.upi{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:#ff6600;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
margin-top:25px;
padding:15px;
background:#ff6600;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#e65c00;
}

</style>

</head>

<body>

<nav>

<div class="logo">🕉 GMP TIGERS</div>

<ul>
<li><a href="/">Home</a></li>
<li><a href="/events">Events</a></li>
<li><a href="/gallery">Gallery</a></li>
<li><a href="/tshirt">T-Shirts</a></li>
<li><a href="/donation">Donate</a></li>
<li><a href="/contact">Contact</a></li>
</ul>

</nav>

<div class="container">

<div class="left">

<h2>🙏 Scan & Donate</h2>

<img src="{{ url_for('static', filename='images/upi_qr.png') }}">

<div class="upi">
UPI ID:<br>
9494336902-2@ybl
</div>

</div>

<div class="right">

<h2>Donation Details</h2>

<form method="POST">

<label>Name</label>
<input type="text" name="name" required>

<label>Mobile</label>
<input type="text" name="mobile" required>

<label>Amount (₹)</label>
<input type="number" name="amount" required>

<label>Payment Mode</label>
<select name="payment_mode" required>
<option>PhonePe</option>
<option>Google Pay</option>
<option>Paytm</option>
<option>Cash</option>
</select>

<label>UPI Transaction ID</label>
<input type="text" name="transaction_id" placeholder="Example: T2408123456789" required>

<button type="submit">Submit Donation</button>

</form>

</div>

</div>

</body>
</html>
